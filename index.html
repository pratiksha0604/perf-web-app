<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A high-performance web application" />
    <title>Performance Web App</title>
  </head>
  <body>
    <header>
      <h1>High-Performance Web App</h1>
    </header>

    <main id="app">
      <button id="loadBtn">Load Heavy Component</button>
      <div id="output"></div>

      <input id="search" type="text" placeholder="Search items (debounced)..." />
      <ul id="list"></ul>

      <div class="spacer"></div>

      <img
        src="/images/photo.webp"
        width="600"
        height="400"
        loading="lazy"
        decoding="async"
        alt="Sample lazy-loaded photo"
      />
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
